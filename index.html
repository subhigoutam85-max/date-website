
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Date For You 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffd6e8, #ffeef5);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 35px 24px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(255, 77, 136, 0.2);
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 2;
    }

    h1 {
      color: #ff4d88;
      font-size: clamp(23px, 5vw, 30px);
      line-height: 1.4;
    }

    p {
      color: #555;
      font-size: 16px;
      line-height: 1.6;
    }

    .details {
      margin: 22px 0;
      font-size: 15px;
      color: #333;
      line-height: 2;
      text-align: left;
      display: inline-block;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 60px;
      position: relative;
    }

    button {
      padding: 13px 27px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .yes {
      background: #ff4d88;
      color: white;
      box-shadow: 0 5px 15px rgba(255, 77, 136, 0.25);
      transition: transform 0.2s, background 0.2s;
    }

    .yes:hover {
      background: #ff1a66;
      transform: scale(1.08);
    }

    .no {
      background: #e5e5e5;
      color: #333;
      position: relative;
      z-index: 5;
      touch-action: manipulation;
    }

    .heart {
      position: fixed;
      bottom: -30px;
      left: 0;
      color: #ff4d88;
      pointer-events: none;
      user-select: none;
      z-index: 1;
      animation: floatUp 5s linear forwards;
      opacity: 0.75;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.6);
        opacity: 0;
      }
      15% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-110vh) rotate(25deg) scale(1.3);
        opacity: 0;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 28px 18px;
      }

      .details {
        font-size: 14px;
      }

      button {
        padding: 12px 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart {
        animation-duration: 8s;
      }
    }
  </style>
</head>

<body>

  <div class="container" id="main">
    <h1>Will You Go On A Date With Me buddhe? 💕</h1>

    <p>
      I have a little plan for us...
      kuki apne mujhe bhot rulaya hai to aana padega 🥹💗
    </p>

    <div class="details">
      📅 <b>Date:</b> Today, 2 November<br>
      ⏰ <b>Time:</b> 7 PM<br>
      📍 <b>Place:</b> Inderpuri, Pani Puri khayge babe 😋
    </div>

    <div class="buttons" id="buttons">
      <button class="yes" id="yesBtn" type="button">
        YES 💖
      </button>

      <button class="no" id="noBtn" type="button">
        NO 🙈
      </button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const main = document.getElementById("main");

    // Make the NO button escape quickly.
    function moveNo() {
      if (!noBtn.isConnected) return;

      // Use the full visible screen so the button
      // cannot get trapped inside the invitation card.
      const margin = 12;
      const maxX = Math.max(
        margin,
        window.innerWidth - noBtn.offsetWidth - margin
      );
      const maxY = Math.max(
        margin,
        window.innerHeight - noBtn.offsetHeight - margin
      );

      const x = margin + Math.random() * (maxX - margin);
      const y = margin + Math.random() * (maxY - margin);

      noBtn.style.position = "fixed";
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
      noBtn.style.margin = "0";
      noBtn.style.transition = "none";
    }

    // Mouse: run away as soon as the pointer enters.
    noBtn.addEventListener("pointerenter", (event) => {
      if (event.pointerType === "mouse") {
        moveNo();
      }
    });

    // Touch: move away when someone tries to tap NO.
    noBtn.addEventListener("touchstart", (event) => {
      event.preventDefault();
      moveNo();
    }, { passive: false });

    // Also handle pen or other pointer interactions.
    noBtn.addEventListener("pointerdown", (event) => {
      if (event.pointerType !== "mouse") {
        event.preventDefault();
        moveNo();
      }
    });

    // Keep the button within the screen after resizing.
    window.addEventListener("resize", () => {
      if (noBtn.style.position === "fixed") {
        moveNo();
      }
    });

    // YES button: send an email and show the success message.
    yesBtn.addEventListener("click", sayYes);

    async function sayYes() {
      yesBtn.disabled = true;
      yesBtn.textContent = "Sending love... 💌";

      try {
        const response = await fetch(
          "https://formsubmit.co/ajax/subhigoutam85@gmail.com",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify({
              _subject: "💕 Someone accepted your date invitation!",
              Answer: "YES 💖",
              Message: "They clicked YES on your date invitation!",
              Date: "2 November",
              Time: "7 PM",
              Place: "Inderpuri, Pani Puri"
            })
          }
        );

        if (!response.ok) {
          throw new Error("Email submission failed");
        }

        const result = await response.json();

        if (result.success === "false") {
          throw new Error("Email service did not accept the submission");
        }

        showSuccess();

      } catch (error) {
        console.error("Email submission failed:", error);

        // The date invitation still celebrates YES,
        // even if the email service is unavailable.
        showSuccess();
      }
    }

    function showSuccess() {
      main.innerHTML = `
        <h1>YAYYYYY 💖🥹</h1>
        <p>You just made me the happiest person ever! 💕</p>
        <p>It's a date then, buddhe! 😘💗</p>
        <p>Ab Pani Puri khilani padegi! 😋❤️</p>
      `;
    }

    // Floating hearts in the background.
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = ["💗", "💕", "💖", "❤️"][
        Math.floor(Math.random() * 4)
      ];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (14 + Math.random() * 18) + "px";
      heart.style.animationDuration = (4 + Math.random() * 3) + "s";

      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 7500);
    }

    setInterval(createHeart, 400);
  </script>

</body>
</html>
