
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Date For You 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffd6e8, #ffeef5);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      background: white;
      padding: 35px 25px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(255, 77, 136, 0.2);
      max-width: 400px;
      width: 100%;
      position: relative;
      z-index: 2;
    }

    h1 {
      color: #ff4d88;
      font-size: clamp(24px, 6vw, 30px);
      line-height: 1.4;
    }

    p {
      color: #555;
      font-size: 16px;
      line-height: 1.6;
    }

    .details {
      margin: 20px auto;
      font-size: 15px;
      color: #333;
      line-height: 2;
      text-align: left;
      display: inline-block;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      min-height: 55px;
      position: relative;
    }

    button {
      padding: 13px 27px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      -webkit-tap-highlight-color: transparent;
    }

    .yes {
      background: #ff4d88;
      color: white;
      box-shadow: 0 5px 15px rgba(255, 77, 136, 0.25);
      transition: 0.2s;
    }

    .yes:hover {
      background: #ff1a66;
      transform: scale(1.08);
    }

    .no {
      background: #ddd;
      color: #333;
      position: relative;
      z-index: 5;
    }

    /* Floating background hearts */
    .heart {
      position: fixed;
      bottom: -35px;
      pointer-events: none;
      z-index: 1;
      animation: floatUp 5s linear forwards;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.6);
        opacity: 0;
      }
      15% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-110vh) rotate(25deg) scale(1.3);
        opacity: 0;
      }
    }

    /* Full-screen YES celebration */
    .success-screen {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: linear-gradient(135deg, #ffb6d5, #ffe6f0, #ffc2df);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
      animation: popIn 0.6s ease;
    }

    .success-screen h1 {
      color: #ff1a66;
      font-size: clamp(32px, 8vw, 48px);
      margin: 15px 0;
      animation: bounce 0.7s infinite alternate;
    }

    .success-screen p {
      color: #a60045;
      font-size: clamp(16px, 4vw, 21px);
      margin: 8px 0;
    }

    .big-heart {
      font-size: clamp(75px, 18vw, 110px);
      animation: heartbeat 0.8s infinite;
    }

    .love-message {
      font-size: clamp(22px, 6vw, 30px);
      color: #ff1a66;
      font-weight: bold;
      margin: 15px 0;
    }

    .celebration-heart {
      position: fixed;
      top: -50px;
      z-index: 10001;
      pointer-events: none;
      animation: heartRain 3.5s linear forwards;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.6);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.2);
      }
    }

    @keyframes bounce {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(-8px);
      }
    }

    @keyframes heartRain {
      0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(115vh) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 28px 17px;
      }

      .details {
        font-size: 14px;
      }

      button {
        padding: 12px 22px;
      }
    }
  </style>
</head>

<body>

  <div class="container" id="main">
    <h1>Will You Go On A Date With Me buddhe? 💕</h1>

    <p>
      I have a little plan for us...
      kuki apne mujhe bhot rulaya hai to aana padega 🥹💗
    </p>

    <div class="details">
      📅 <b>Date:</b> Today, 2 November<br>
      ⏰ <b>Time:</b> 7 PM<br>
      📍 <b>Place:</b> Inderpuri, Pani Puri khayge babe 😋
    </div>

    <div class="buttons">
      <button class="yes" id="yesBtn" type="button">
        YES 💖
      </button>

      <button class="no" id="noBtn" type="button">
        NO 🙈
      </button>
    </div>
  </div>

  <script>
    const main = document.getElementById("main");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");

    let accepted = false;

    // NO button: moves quickly away from the pointer.
    function moveNo() {
      if (accepted || !noBtn.isConnected) return;

      const margin = 12;
      const maxX = Math.max(
        margin,
        window.innerWidth - noBtn.offsetWidth - margin
      );
      const maxY = Math.max(
        margin,
        window.innerHeight - noBtn.offsetHeight - margin
      );

      const x = margin + Math.random() * (maxX - margin);
      const y = margin + Math.random() * (maxY - margin);

      noBtn.style.position = "fixed";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.style.margin = "0";
      noBtn.style.transition = "none";
    }

    // Desktop: run away as soon as the mouse enters.
    noBtn.addEventListener("pointerenter", function(event) {
      if (event.pointerType === "mouse") {
        moveNo();
      }
    });

    // Mobile: run away when touched.
    noBtn.addEventListener("touchstart", function(event) {
      event.preventDefault();
      moveNo();
    }, { passive: false });

    noBtn.addEventListener("pointerdown", function(event) {
      if (event.pointerType !== "mouse") {
        event.preventDefault();
        moveNo();
      }
    });

    // Keep NO button within the visible screen.
    window.addEventListener("resize", function() {
      if (noBtn.style.position === "fixed" && !accepted) {
        moveNo();
      }
    });

    // YES button: show the celebration immediately.
    yesBtn.addEventListener("click", sayYes);

    function sayYes() {
      if (accepted) return;
      accepted = true;

      // This reaction does not wait for the email.
      showSuccess();

      // Email is sent separately in the background.
      sendEmail();
    }

    function showSuccess() {
      main.style.display = "none";

      const screen = document.createElement("div");
      screen.className = "success-screen";

      screen.innerHTML = `
        <div class="big-heart">💖</div>
        <h1>YAYYYYY!!! 🥹💕</h1>
        <p>YOU SAID YESSSS!! 😭❤️</p>
        <p>You just made me the happiest person ever! 🫶</p>
        <div class="love-message">
          It's a date, buddhe! 😘💋
        </div>
        <p>📍 Pani Puri + You + Me = Perfect Date 😋💗</p>
        <p>Ab toh treat deni padegi! 🥰</p>
        <div style="font-size: 35px; margin-top: 15px;">
          💕 💋 🌹 💖 🫶
        </div>
      `;

      document.body.appendChild(screen);

      // Heart rain celebration.
      for (let i = 0; i < 45; i++) {
        setTimeout(createCelebrationHeart, i * 65);
      }
    }

    function createCelebrationHeart() {
      const heart = document.createElement("div");
      heart.className = "celebration-heart";
      heart.textContent = ["💖", "💕", "💗", "❤️", "💋", "🌹"][
        Math.floor(Math.random() * 6)
      ];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (20 + Math.random() * 24) + "px";
      heart.style.animationDuration = (2.5 + Math.random() * 2) + "s";

      document.body.appendChild(heart);

      setTimeout(function() {
        heart.remove();
      }, 5000);
    }

    // Send YES response to your email.
    async function sendEmail() {
      try {
        const response = await fetch(
          "https://formsubmit.co/ajax/subhigoutam85@gmail.com",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify({
              _subject: "💕 Someone accepted your date invitation!",
              Answer: "YES 💖",
              Message: "They clicked YES on your date invitation!",
              Date: "2 November",
              Time: "7 PM",
              Place: "Inderpuri, Pani Puri"
            })
          }
        );

        if (!response.ok) {
          throw new Error("Email submission failed");
        }

        console.log("Email request successful 💌");

      } catch (error) {
        // The celebration still works if email fails.
        console.error("Email could not be sent:", error);
      }
    }

    // Floating hearts in the background.
    function createHeart() {
      if (accepted) return;

      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = ["💗", "💕", "💖", "❤️"][
        Math.floor(Math.random() * 4)
      ];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (14 + Math.random() * 18) + "px";
      heart.style.animationDuration = (4 + Math.random() * 3) + "s";

      document.body.appendChild(heart);

      setTimeout(function() {
        heart.remove();
      }, 7500);
    }

    setInterval(createHeart, 400);
  </script>

</body>
</html>
